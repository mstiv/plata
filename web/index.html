<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plata</title>
  <meta name="description" content="Plata — digital wallet, cards, crypto and payments">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="preload" href="assets/GolosText-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="rail-brand">
        <div class="rail-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="29" stroke="currentColor" stroke-width="2.5"/>
            <path d="M25 46V19h9.5a7.5 7.5 0 0 1 0 15H25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div class="rail-name">Plata</div>
          <div class="rail-sub" id="railTagline"></div>
        </div>
      </div>

      <nav class="mods" id="mods" aria-label="Modules"></nav>

      <div class="rail-bottom">
        <div class="rail-label" id="langLabel"></div>
        <div class="seg" role="group" aria-label="Language">
          <button data-lang="en">EN</button>
          <button data-lang="es">ES</button>
          <button data-lang="ru">RU</button>
        </div>
      </div>
    </aside>

    <main class="stage" id="stage">
      <div class="glow g1"></div>
      <div class="glow g2"></div>
      <div class="stage-inner">
        <div class="phone-fit" id="phoneFit">
          <div class="phone">
            <div class="screen">
              <div class="island"></div>
              <div class="status">
                <span>9:41</span>
                <div class="sicons">
                  <div class="bars"><b style="height:4px"></b><b style="height:6px"></b><b style="height:8px"></b><b style="height:11px"></b></div>
                  <svg width="15" height="11" viewBox="0 0 16 12"><path d="M8 11.5 L5.6 9 A3.4 3.4 0 0 1 10.4 9 Z M2.6 6 A7.6 7.6 0 0 1 13.4 6 L12 7.4 A5.6 5.6 0 0 0 4 7.4 Z M0 3.2 A11.4 11.4 0 0 1 16 3.2 L14.6 4.6 A9.4 9.4 0 0 0 1.4 4.6 Z" fill="currentColor"/></svg>
                  <div class="batt"><b></b></div>
                </div>
              </div>
              <div class="toast" id="toast"></div>
              <div class="views" id="views"></div>
              <div class="tabbar" id="tabbar"></div>
              <div class="sheet-host" id="sheetHost"></div>
              <button class="homebar-hit" data-act="homebar" aria-label="Home"><span class="homebar"></span></button>
            </div>
          </div>
        </div>

        <section class="explain" id="explain" aria-live="polite"></section>
      </div>
    </main>
  </div>

  <script src="i18n.js"></script>
  <script src="strings.js"></script>
  <script src="explain.js"></script>
  <script src="app.js"></script>
</body>
</html>
